  <style>
    .siteFooter{margin:18px 0 10px;font-size:12px;opacity:.9}
    .siteFooterInner{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
    .siteFooterLink{color:#fff;text-decoration:none}
    .siteFooterLink:visited{color:#fff}
    .siteFooterLink:hover{text-decoration:underline}

    /* Masquer le Sommaire et passer en 1 colonne */
    .navPanel{display:none !important;}
    .typeGrid{grid-template-columns:1fr !important;}

  <link rel="alternate" hreflang="fr" href="https://lemiroirinterieur.fr/type.html" />
  <link rel="alternate" hreflang="en" href="https://lemiroirinterieur.fr/en/type.html" />

<body>
  <div class="wrap typeWrap">
    <header class="typeTop">
      <a class="backBtn" href="/en/index.html">Back</a>

      <div class="typeHead">
        <h1 id="typeTitle">Full profile</h1>
        <p id="typeSubtitle">—</p>
      </div>

      <div class="typeTools">
        <input id="searchBox" type="search" placeholder="Search the profile…" />
        <button id="btnExpandAll" type="button">Expand all</button>
        <button id="btnCollapseAll" type="button">Collapse all</button>
      </div>
    </header>

    <section class="quickBar">
      <div class="qChip"><span class="qK">Type</span><span class="qV" id="qType">—</span></div>
      <div class="qChip"><span class="qK">Center</span><span class="qV" id="qCenter">—</span></div>
      <div class="qChip"><span class="qK">Wings</span><span class="qV" id="qWings">—</span></div>
      <div class="qChip"><span class="qK">Integration</span><span class="qV" id="qIntegr">—</span></div>
      <div class="qChip"><span class="qK">Disintegration</span><span class="qV" id="qDisint">—</span></div>
    </section>

    <main class="typeGrid">
      <section class="sectionsPanel">
        <h2 class="panelTitle">Categories</h2>
        <p class="panelHint">Click a card to open it. You can reorder the cards by dragging them.</p>

        <div id="sectionsGrid" class="sectionsGrid"></div>
      </section>

      <aside class="navPanel">
        <h2 class="panelTitle">Contents</h2>
        <div id="toc" class="toc"></div>
      </aside>
    </main>

    <footer class="siteFooter">
      <div class="siteFooterInner">
        <span>Brams — All rights reserved</span>
        <a class="siteFooterLink" href="https://docs.google.com/forms/d/e/1FAIpQLScLBwWZA-VZf4OaIEl11fnKasayyVrll7DZL5A3uZZBCwLdkQ/viewform?usp=dialog" target="_blank" rel="noopener">✉️ Write to Brahms</a>
      </div>
    </footer>
  </div>

  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="drawerOverlay" id="drawerOverlay"></div>

    <div class="drawerPanel" role="dialog" aria-modal="true" aria-label="Section content">
      <div class="drawerTop">
        <div class="drawerTitleRow">
          <div class="drawerIcon" id="drawerIcon">📌</div>
          <div class="drawerTitles">
            <div class="drawerTitle" id="drawerTitle">—</div>
            <div class="drawerSub" id="drawerSub">—</div>
          </div>
        </div>
        <div class="drawerActions">
          <button id="btnPin" type="button">Pin</button>
          <button id="btnClose" type="button">Close</button>
        </div>
      </div>

      <div class="drawerBody">
        <div id="drawerContent" class="drawerContent"></div>
      </div>
    </div>
  </div>

  <script src="/assets/js/en/type.js?v=12"></script>
<script type="module" src="/assets/js/pulse.js?v=3"></script>
  <script defer src="/assets/js/lang.js"></script>
</body>
</html>
