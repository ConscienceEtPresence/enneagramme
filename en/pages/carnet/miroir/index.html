  <style>
    .cal-grid { display:grid; grid-template-columns:repeat(14,1fr); gap:6px; max-width:32rem; margin:1.5rem auto; }
    @media (max-width:480px){ .cal-grid { grid-template-columns:repeat(10,1fr);} }
    .cal-cell { aspect-ratio:1; border-radius:6px; background:var(--car-glass); border:1px solid var(--car-line); cursor:pointer; transition:all .2s; position:relative; }
    .cal-cell.is-visited { background:rgba(244,207,106,.18); border-color:rgba(244,207,106,.5); }
    .cal-cell.is-today { box-shadow:0 0 0 2px var(--car-gold); }
    .cal-cell:hover { transform:scale(1.1); border-color:var(--car-gold); }
    .day-detail { margin-top:2rem; padding:1.3rem; background:var(--car-panel); border:1px solid var(--car-line); border-radius:14px; }
    .day-detail h3 { font-family:'Cormorant Garamond',serif; color:var(--car-gold); margin:0 0 1rem; font-weight:500; }
    .day-detail dl { display:grid; grid-template-columns:max-content 1fr; gap:.4rem 1rem; font-size:.94rem; }
    .day-detail dt { color:var(--car-muted); font-size:.85rem; letter-spacing:.1em; text-transform:uppercase; align-self:start; padding-top:.1rem; }
    .day-detail dd { margin:0; color:var(--car-text-soft); font-family:'Cormorant Garamond',serif; font-style:italic; line-height:1.5; }
    .day-detail__empty { color:var(--car-muted); font-style:italic; text-align:center; font-family:'Cormorant Garamond',serif; }
  </style>
